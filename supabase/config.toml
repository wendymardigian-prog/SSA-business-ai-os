[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600

# Receptor publico de webhooks de canales (Evolution API y Zernio).
# verify_jwt = false porque quien llama es un proveedor externo, no un usuario
# logueado. La autenticacion la hace la funcion: token compartido para Evolution
# y firma HMAC para Zernio.
[functions.channel-webhook]
verify_jwt = false
