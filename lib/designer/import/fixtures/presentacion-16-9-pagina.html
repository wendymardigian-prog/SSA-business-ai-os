<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Deck con @page</title>
<style>
  @page { size: 1280px 720px; margin: 0; }
  body { margin: 0; font-family: Verdana, sans-serif; }
  .deck { display: block; }
  .slide { width: 1280px; height: 720px; page-break-after: always; display: flex; align-items: center; justify-content: center; background: #ecfeff; }
  .slide h2 { font-size: 64px; color: #155e75; }
</style>
</head>
<body>
  <main class="deck">
    <section class="slide"><h2>Bienvenidas y bienvenidos</h2></section>
    <section class="slide"><h2>Agenda de hoy</h2></section>
    <section class="slide"><h2>Preguntas frecuentes</h2></section>
    <section class="slide"><h2>Gracias</h2></section>
  </main>
</body>
</html>
