<body>
  <div class="page" style="width:1080px;height:1350px"><h2>5 hábitos para ordenar tu semana</h2><p>Deslizá para verlos</p></div>
  <div class="page" style="width:1080px;height:1350px"><h2>1. Planificá el lunes</h2><p>Diez minutos alcanzan.</p></div>
  <div class="page" style="width:1080px;height:1350px"><h2>2. Elegí tres prioridades</h2><p>Lo demás puede esperar.</p></div>
  <div class="page" style="width:1080px;height:1350px"><h2>3. Cerrá el día</h2><p>Revisá qué quedó pendiente.</p></div>
  <div class="page" style="width:1080px;height:1350px"><h2>4. Pedí ayuda a tiempo</h2><p>Antes de que se acumule.</p></div>
  <div class="page" style="width:1080px;height:1350px"><h2>5. Descansá</h2><p>Un equipo cansado no rinde.</p></div>
