<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Presentación de ejemplo</title>
<style>
  body { margin: 0; background: #0b1020; }
  .slide { width: 1920px; height: 1080px; box-sizing: border-box; padding: 120px; background: #111827; color: #f9fafb; font-family: Arial, sans-serif; }
  .slide h1 { font-size: 96px; margin: 0 0 24px; }
  .slide p { font-size: 44px; margin: 0; }
</style>
</head>
<body>
  <div class="slide"><h1>Plan del trimestre</h1><p>Academia Ejemplo</p></div>
  <div class="slide"><h1>El problema</h1><p>Demasiadas tareas sueltas.</p></div>
  <div class="slide"><h1>La propuesta</h1><p>Un tablero simple y una reunión corta por semana.</p></div>
  <div class="slide"><h1>Resultados esperados</h1><p>Menos urgencias y más foco.</p></div>
  <div class="slide"><h1>Próximos pasos</h1><p>Elegir responsables y fechas.</p></div>
</body>
</html>
