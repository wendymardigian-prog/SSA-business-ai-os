<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clase gratuita · Academia Ejemplo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap">
<style>
  :root { --brand: #5b21b6; }
  body { margin: 0; font-family: Inter, sans-serif; color: #111; }
  .hero { padding: 96px 24px; text-align: center; background: var(--brand); color: #fff; }
  .hero h1 { font-size: 48px; margin: 0 0 12px; }
  .section { padding: 64px 24px; }
  .section h2 { font-size: 32px; }
  .cta { display: inline-block; padding: 14px 28px; background: #fff; color: var(--brand); border-radius: 8px; }
</style>
</head>
<body>
  <header class="hero">
    <h1>Aprendé a ordenar tu negocio</h1>
    <p>Una clase gratuita con ejemplos reales de Academia Ejemplo.</p>
    <a class="cta" href="#registro">Quiero mi lugar</a>
  </header>
  <section class="section">
    <h2>Qué vas a aprender</h2>
    <ul><li>Cómo ordenar tus tareas</li><li>Cómo medir lo importante</li><li>Cómo delegar sin perder el control</li></ul>
  </section>
  <section class="section" id="registro">
    <h2>Reservá tu lugar</h2>
    <form action="/inscribirse" method="post">
      <input type="text" name="nombre" placeholder="Tu nombre">
      <input type="email" name="email" placeholder="Tu email">
      <button type="submit">Enviar</button>
    </form>
  </section>
  <script>window.dataLayer = []; document.title = "x";</script>
</body>
</html>
