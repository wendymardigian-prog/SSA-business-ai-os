<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Página con secciones</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; }
  .section { min-height: 100vh; padding: 48px; }
  .section:nth-child(odd) { background: #f1f5f9; }
  .page { width: 800px; }
</style>
</head>
<body>
  <section class="section"><h2>Quiénes somos</h2><p>Un equipo chico con ganas de ayudar.</p></section>
  <section class="section"><h2>Qué hacemos</h2><p>Acompañamos a negocios en su orden diario.</p></section>
  <section class="section"><h2>Cómo contactarnos</h2><div class="page"><p>Por correo o por mensaje.</p></div></section>
</body>
</html>
